name: MakeCode Arcade Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One job per hardware variant. Each runs in a fresh checkout because
  # `pxt install --hw` rewrites pxt.json for the chosen variant.
  hardware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - hw: samd51
            board: d51
          - hw: stm32f401
            board: f4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install MakeCode Arcade
        run: |
          npm install -g pxt
          pxt target arcade
      - name: Build ${{ matrix.hw }}
        run: |
          pxt install --hw ${{ matrix.hw }}
          pxt build --hw ${{ matrix.hw }} --cloud
          cp built/binary.uf2 air-combat-${{ matrix.board }}.uf2
      - uses: actions/upload-artifact@v7
        with:
          name: uf2-${{ matrix.board }}
          path: air-combat-${{ matrix.board }}.uf2

  # Attach per-board files plus a combined arcade.uf2 to the release.
  # UF2 files for different boards can be concatenated; each bootloader
  # only flashes the blocks that carry its own family id.
  publish:
    needs: hardware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: uf2-*
          merge-multiple: true
      - name: Bundle
        run: |
          ls -la *.uf2
          cat air-combat-*.uf2 > arcade.uf2
      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            arcade.uf2 air-combat-*.uf2 \
            --repo "${{ github.repository }}" --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: arcade-uf2
          path: |
            arcade.uf2
            air-combat-*.uf2
