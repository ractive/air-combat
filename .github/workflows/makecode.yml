name: MakeCode

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install MakeCode Arcade
        run: |
          npm install -g pxt
          pxt target arcade
      - name: Build
        run: |
          pxt install
          pxt build
        env:
          CI: true
